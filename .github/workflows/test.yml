name: Test

# The promised `test` action: run the kit's headless tests on every push, so a
# change that breaks the contract is caught immediately.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # was @v7.1.0
        with:
          node-version: "20"
      - name: Run tests
        run: node test-node.js
